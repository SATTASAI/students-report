<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปพ.6 — แบบรายงานผลการพัฒนาคุณภาพผู้เรียนรายบุคคล</title>
<link rel="stylesheet" href="/print/print.css">
</head>
<body>
<div id="doc"><div class="status">กำลังเตรียมเอกสาร…</div></div>
<script type="module">
import { params, get, toolbar, status } from "/print/print.js";
import { renderPp6 } from "/print/pp6-render.js";

const p = params();
const q = new URLSearchParams({ grade: p.get("grade") || "", room: p.get("room") || "" });
if (p.get("year")) q.set("year", p.get("year"));
if (p.get("student")) q.set("student", p.get("student"));
// ?term=1 = ปพ.6 ภาคเรียนที่ 1 (คะแนนภาค 1 ยังไม่ตัดเกรด) · ?term=2 (หรือไม่ระบุ) = ภาคเรียนที่ 2 สรุปทั้งปี: คะแนนภาค 1 + ภาค 2 + ผลการเรียน
const TERM = p.get("term") === "1" ? 1 : 2;
let d;
try { d = await get(`/api/reports/room?${q}`); } catch (e) { status(e.message); throw e; }
// นักเรียนที่ย้ายออก/ออกกลางคันไม่อยู่ในรายชื่อแล้ว (soft delete) — ดูประวัติได้ที่หน้า "นักเรียนย้ายเข้า/ย้ายออก"
toolbar(`ปพ.6 ${d.grade}/${d.room} ภาคเรียนที่ ${TERM}${TERM === 2 ? " (สรุปทั้งปี)" : ""} ปีการศึกษา ${d.year.year_be}`);
document.title = `ปพ.6 ${d.grade}-${d.room} ภาค${TERM} ${d.year.year_be}`;
if (!d.students.length) { status("ไม่มีนักเรียนในห้องนี้"); throw new Error("empty"); }
document.getElementById("doc").innerHTML = renderPp6(d, TERM);
</script>
</body>
</html>
